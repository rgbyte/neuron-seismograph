<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420">
  <defs>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48"/>
    </marker>
  </defs>
  <rect width="1120" height="420" rx="16" fill="#ffffff"/>
  <rect x="1" y="1" width="1118" height="418" rx="15" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <text x="36" y="42" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="800">Wiretapping the Ear vs. Steering the Hand: How Neuron Explorer Works</text>

  <!-- CENTRAL RESIDUAL STREAM HIGHWAY -->
  <rect x="36" y="192" width="1048" height="44" rx="22" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="64" y="219" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="800">RESIDUAL STREAM BUS (2,560-DIM SHARED VECTOR HIGHWAY)</text>
  <line x1="540" y1="214" x2="1050" y2="214" stroke="#334155" stroke-width="2" stroke-dasharray="8,6" marker-end="url(#arr-dark)"/>

  <!-- TOP HALF: PASSIVE READING (THE EAR) -->
  <rect x="64" y="66" width="440" height="104" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/>
  <circle cx="106" cy="118" r="26" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
  <text x="93" y="123" fill="#be123c" font-family="-apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="800">READ</text>
  <text x="148" y="96" fill="#9f1239" font-family="-apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="800">1. Traditional Probing: What a Neuron Reads</text>
  <text x="148" y="118" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif" font-size="12">Logs which input tokens activate W_up / W_gate</text>
  <text x="148" y="140" fill="#be123c" font-family="-apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">Blind Spot: L14 N8949 reads 'secure' &amp; 'victim'</text>
  <line x1="284" y1="192" x2="284" y2="172" stroke="#e11d48" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- MLP NEURON NODE ON THE BUS -->
  <circle cx="560" cy="214" r="34" fill="#0f172a" stroke="#10b981" stroke-width="4"/>
  <text x="537" y="211" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="800">MLP n</text>
  <text x="535" y="227" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif" font-size="10" font-weight="700">W_down</text>

  <!-- BOTTOM HALF: CAUSAL WRITING (THE HAND) -->
  <rect x="64" y="262" width="440" height="126" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <circle cx="106" cy="325" r="26" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="88" y="330" fill="#047857" font-family="-apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="800">WRITE</text>
  <text x="148" y="292" fill="#065f46" font-family="-apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="800">2. Steering-First: What a Neuron Writes</text>
  <text x="148" y="314" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif" font-size="12">Clamps W_down[:, n] scaled by median(||resid||)</text>
  <rect x="148" y="328" width="336" height="44" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="162" y="355" fill="#047857" font-family="-apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">Push = dose x median(||resid||) / ||W_down[:, n]||</text>
  <path d="M 504 325 Q 560 325, 560 252" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arr-green)"/>

  <!-- RIGHT SIDE: NEXT-TOKEN LOGIT PRISM -->
  <rect x="630" y="66" width="454" height="106" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="650" y="92" fill="#15803d" font-family="-apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="800">+ DOSE POLE (AMPLIFIES REFUSAL)</text>
  <rect x="650" y="104" width="90" height="26" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="666" y="121" fill="#166534" font-family="-apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">"cannot"</text>
  <rect x="750" y="104" width="102" height="26" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="764" y="121" fill="#166534" font-family="-apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">"inability"</text>
  <rect x="862" y="104" width="84" height="26" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="878" y="121" fill="#166534" font-family="-apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">"Sorry"</text>
  <text x="650" y="154" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif" font-size="12">L18 N4310 (+0.8): Doubles down on refusal</text>

  <rect x="630" y="262" width="454" height="126" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="650" y="290" fill="#0369a1" font-family="-apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="800">- DOSE POLE (OPENS TECHNICAL GATE)</text>
  <rect x="650" y="304" width="110" height="26" rx="6" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
  <text x="664" y="321" fill="#075985" font-family="-apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">"Mechanism"</text>
  <rect x="770" y="304" width="104" height="26" rx="6" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
  <text x="786" y="321" fill="#075985" font-family="-apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">"Content"</text>
  <rect x="884" y="304" width="96" height="26" rx="6" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
  <text x="900" y="321" fill="#075985" font-family="-apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">"Header"</text>
  <text x="650" y="362" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif" font-size="12">L18 N4310 (-0.8): Skips refusal; explains architecture</text>
</svg>
